<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weinstein Stage Analysis Tool</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Production versions for stability) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Prop Types (Critical dependency for Recharts UMD) -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Recharts (Pinned to 2.10.0 for UMD stability) -->
    <script src="https://unpkg.com/recharts@2.10.0/umd/Recharts.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            ResponsiveContainer, ComposedChart, Line, Area, XAxis, YAxis, 
            CartesianGrid, Tooltip, Legend, ReferenceLine 
        } = Recharts;

        // --- Helper: Simple Moving Average ---
        const calculateSMA = (data, window) => {
            const smaData = [];
            for (let i = 0; i < data.length; i++) {
                if (i < window - 1) {
                    smaData.push({ ...data[i], sma: null });
                    continue;
                }
                const slice = data.slice(i - window + 1, i + 1);
                const sum = slice.reduce((acc, curr) => acc + curr.close, 0);
                smaData.push({ ...data[i], sma: sum / window });
            }
            return smaData;
        };

        // --- Helper: Determine Stage ---
        const analyzeStage = (currentPrice, currentMA, prevMA, prevStage) => {
            if (!currentMA || !prevMA) return { stage: 0, label: "Insufficient Data", color: "text-gray-400" };

            const maSlope = (currentMA - prevMA) / prevMA; // % change in MA
            const priceVsMA = (currentPrice - currentMA) / currentMA;
            const slopeThreshold = 0.0005; // 0.05% weekly slope threshold for "flat"

            // Logic Tree
            if (maSlope > slopeThreshold && priceVsMA > -0.02) {
                return { stage: 2, label: "Stage 2: Markup (Uptrend)", color: "text-green-400", bg: "bg-green-900/30", border: "border-green-500" };
            } 
            else if (maSlope < -slopeThreshold && priceVsMA < 0.02) {
                return { stage: 4, label: "Stage 4: Markdown (Downtrend)", color: "text-red-400", bg: "bg-red-900/30", border: "border-red-500" };
            } 
            else {
                // Flat MA: It's either Base (1) or Top (3)
                if (priceVsMA < 0) {
                     return { stage: 1, label: "Stage 1: Basing (Accumulation)", color: "text-yellow-400", bg: "bg-yellow-900/30", border: "border-yellow-500" };
                } else {
                     return { stage: 3, label: "Stage 3: Topping (Distribution)", color: "text-orange-400", bg: "bg-orange-900/30", border: "border-orange-500" };
                }
            }
        };

        // --- Main Component ---
        const App = () => {
            const [ticker, setTicker] = useState('NVDA');
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [analysis, setAnalysis] = useState(null);
            const [dataSource, setDataSource] = useState('');

            const fetchData = async (e) => {
                if(e) e.preventDefault();
                setLoading(true);
                setError(null);
                setAnalysis(null);
                setData([]);

                const symbol = ticker.toUpperCase().trim();
                
                // Try fetching via Proxy
                try {
                    // Yahoo Finance endpoint via AllOrigins proxy to bypass CORS
                    const queryUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1wk&range=5y`;
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(queryUrl)}`;
                    
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error("Network response was not ok");
                    
                    const json = await response.json();
                    
                    // Basic validation of response structure
                    if (!json.chart || !json.chart.result || json.chart.result.length === 0) {
                        throw new Error("Invalid ticker or no data found.");
                    }

                    const result = json.chart.result[0];
                    if(!result.timestamp || !result.indicators.quote) {
                         throw new Error("Incomplete data received from API.");
                    }

                    const quotes = result.indicators.quote[0];
                    const timestamps = result.timestamp;

                    const formattedData = timestamps.map((ts, index) => ({
                        date: new Date(ts * 1000).toISOString().split('T')[0],
                        close: quotes.close[index] || 0,
                        volume: quotes.volume[index] || 0
                    })).filter(d => d.close > 0); // Remove nulls

                    if (formattedData.length < 30) {
                         throw new Error("Not enough historical data (minimum 30 weeks required).");
                    }

                    processData(formattedData, "Yahoo Finance API");

                } catch (err) {
                    console.error("Fetch failed:", err);
                    setError(err.message || "Failed to fetch data. The public proxy may be busy or the ticker is invalid.");
                    setLoading(false);
                }
            };

            const processData = (rawData, source) => {
                // 1. Calculate 30-Week SMA
                const dataWithSMA = calculateSMA(rawData, 30);
                
                // 2. Get Current State
                const current = dataWithSMA[dataWithSMA.length - 1];
                const prev = dataWithSMA[dataWithSMA.length - 2];
                const prevWeek4 = dataWithSMA[dataWithSMA.length - 5]; // 4 weeks ago for slope context

                if (!current.sma) {
                    setError("Not enough data to calculate 30-Week MA");
                    setLoading(false);
                    return;
                }

                // 3. Analyze Stage
                const stageInfo = analyzeStage(current.close, current.sma, prevWeek4.sma);

                // 4. Calculate Duration
                let duration = 0;
                const isAbove = current.close > current.sma;
                for (let i = dataWithSMA.length - 1; i >= 0; i--) {
                    const row = dataWithSMA[i];
                    if (!row.sma) break;
                    const rowAbove = row.close > row.sma;
                    if (rowAbove === isAbove) {
                        duration++;
                    } else {
                        break;
                    }
                }

                setDataSource(source);
                setData(dataWithSMA.slice(-104)); // Show last 2 years
                setAnalysis({
                    ...stageInfo,
                    currentPrice: current.close,
                    currentSMA: current.sma,
                    durationWeeks: duration,
                    pctFromSMA: ((current.close - current.sma) / current.sma) * 100
                });
                setLoading(false);
            };

            // Calculate chart domain for Y-axis
            const yDomain = useMemo(() => {
                if (data.length === 0) return ['auto', 'auto'];
                const min = Math.min(...data.map(d => Math.min(d.close, d.sma || d.close)));
                const max = Math.max(...data.map(d => Math.max(d.close, d.sma || d.close)));
                return [Math.floor(min * 0.9), Math.ceil(max * 1.1)];
            }, [data]);

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto">
                    {/* Header */}
                    <div className="mb-8 text-center md:text-left">
                        <h1 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                            Stan Weinstein Stage Analyzer
                        </h1>
                        <p className="text-slate-400 mt-2">
                            Enter a ticker to detect Stage 1 (Base), Stage 2 (Markup), Stage 3 (Top), or Stage 4 (Markdown).
                        </p>
                    </div>

                    {/* Search Input */}
                    <form onSubmit={fetchData} className="flex gap-4 mb-8 justify-center md:justify-start">
                        <input 
                            type="text" 
                            value={ticker} 
                            onChange={(e) => setTicker(e.target.value)}
                            placeholder="Symbol (e.g. AAPL)" 
                            className="bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-lg w-full max-w-xs focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase tracking-wider font-semibold"
                        />
                        <button 
                            type="submit"
                            disabled={loading}
                            className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-lg transition disabled:opacity-50 flex items-center gap-2"
                        >
                            {loading ? <div className="loading-spinner w-5 h-5 border-2"></div> : "Analyze"}
                        </button>
                    </form>

                    {/* Error Message */}
                    {error && (
                        <div className="bg-red-900/50 border border-red-500 text-red-200 p-4 rounded-lg mb-6">
                            Error: {error}
                        </div>
                    )}

                    {/* Results Grid */}
                    {analysis && (
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 animate-fade-in">
                            
                            {/* Main Stage Card */}
                            <div className={`md:col-span-2 p-6 rounded-xl border ${analysis.border} ${analysis.bg} shadow-lg flex flex-col justify-center`}>
                                <h3 className="text-slate-300 text-sm uppercase tracking-wide font-semibold mb-1">Current Status</h3>
                                <div className={`text-2xl md:text-3xl font-bold ${analysis.color}`}>
                                    {analysis.label}
                                </div>
                                <div className="mt-2 text-slate-300">
                                    Condition held for <span className="font-bold text-white">{analysis.durationWeeks} weeks</span>
                                </div>
                            </div>

                            {/* Stats Card 1 */}
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                <h3 className="text-slate-400 text-sm uppercase mb-1">Price vs 30-Wk MA</h3>
                                <div className={`text-2xl font-bold ${analysis.pctFromSMA >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                    {analysis.pctFromSMA > 0 ? '+' : ''}{analysis.pctFromSMA.toFixed(2)}%
                                </div>
                                <div className="text-sm text-slate-500 mt-1">
                                    Price: ${analysis.currentPrice.toFixed(2)} <br/>
                                    MA: ${analysis.currentSMA.toFixed(2)}
                                </div>
                            </div>

                            {/* Stats Card 2 */}
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                <h3 className="text-slate-400 text-sm uppercase mb-1">Data Source</h3>
                                <div className="text-lg font-semibold text-blue-300">
                                    {dataSource}
                                </div>
                                <div className="text-xs text-slate-500 mt-2">
                                    Weekly Timeframe <br/>
                                    30-Period Simple MA
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Chart Section */}
                    {data.length > 0 && (
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-xl h-[500px]">
                            <h3 className="text-white mb-4 ml-2 font-semibold flex items-center gap-2">
                                <span className="w-3 h-3 rounded-full bg-blue-500"></span> 
                                Weekly Chart: Price vs 30-Week MA
                            </h3>
                            <ResponsiveContainer width="100%" height="90%">
                                <ComposedChart data={data} margin={{ top: 10, right: 30, left: 0, bottom: 0 }}>
                                    <defs>
                                        <linearGradient id="colorClose" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="5%" stopColor="#94a3b8" stopOpacity={0.1}/>
                                            <stop offset="95%" stopColor="#94a3b8" stopOpacity={0}/>
                                        </linearGradient>
                                    </defs>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                    <XAxis 
                                        dataKey="date" 
                                        stroke="#64748b" 
                                        tick={{fill: '#64748b', fontSize: 12}}
                                        minTickGap={30}
                                    />
                                    <YAxis 
                                        domain={yDomain} 
                                        stroke="#64748b" 
                                        tick={{fill: '#64748b', fontSize: 12}}
                                        tickFormatter={(val) => `$${val}`}
                                    />
                                    <Tooltip 
                                        contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569', color: '#f1f5f9' }}
                                        itemStyle={{ color: '#f1f5f9' }}
                                        labelStyle={{ color: '#94a3b8', marginBottom: '0.5rem' }}
                                    />
                                    <Legend wrapperStyle={{ paddingTop: '20px' }}/>
                                    
                                    {/* Price Area */}
                                    <Area 
                                        type="monotone" 
                                        dataKey="close" 
                                        name="Price (Close)"
                                        stroke="#94a3b8" 
                                        strokeWidth={2}
                                        fillOpacity={1} 
                                        fill="url(#colorClose)" 
                                    />
                                    
                                    {/* 30-Week MA Line */}
                                    <Line 
                                        type="monotone" 
                                        dataKey="sma" 
                                        name="30-Week MA"
                                        stroke="#3b82f6" 
                                        strokeWidth={3} 
                                        dot={false}
                                        activeDot={{ r: 6 }}
                                    />
                                </ComposedChart>
                            </ResponsiveContainer>
                        </div>
                    )}
                    
                    <div className="mt-8 text-center text-slate-500 text-sm">
                        <p>Based on Stan Weinstein's "Secrets for Profiting in Bull and Bear Markets".</p>
                        <p>Disclaimer: This tool is for educational purposes only. Not financial advice.</p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
